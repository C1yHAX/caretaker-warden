; Warden 1.0.0 - default configuration / Standardkonfiguration
; Restart the game after changing language or toggleKey.
; Nach Aenderungen an Sprache oder Menue-Taste das Spiel neu starten.
; Keep your existing settings.ini when updating Warden.
; Beim Aktualisieren eine vorhandene settings.ini behalten.

; Menu language / Menuesprache: de = Deutsch, en = English
language = de

; Open/close menu / Menue oeffnen/schliessen (F1, F2, ...)
; Ctrl + this key releases input / Strg + diese Taste gibt die Eingabe frei.
toggleKey = F1

; Window position / Fensterposition: left, center, right
position = left

; Allow walking while the menu is open / Laufen bei offenem Menue
walk = true

; Block clicks outside the menu / Klicks ausserhalb des Menues blockieren
block = true

; Extra UI diagnostics / Zusaetzliche UI-Diagnose
trace = false
